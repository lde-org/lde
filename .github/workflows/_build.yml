name: Build

# Reusable build: callers own the trigger and everything after the binaries
# (rockspecs, docker); this owns the target matrix and every build path.
#
# Target an older minimum OS on the newest runner so the binaries also run on
# macOS 14+ (see nightly.yml for details).
env:
  MACOSX_DEPLOYMENT_TARGET: "14.0"

on:
  workflow_call:
    inputs:
      run_tests:
        description: Run the test suite on every runner that can execute the binary.
        type: boolean
        default: false
      publish:
        description: "Where the binaries go: none, artifact, nightly, or release."
        type: string
        default: "none"
      bootstrap:
        description: Build with minilde.lua and a downloaded LuaJIT instead of a nightly lde.
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            outfile: lde-linux-x86-64
            zipfile: lde-linux-x86-64.zip
            luajit_tarball: luajit-linux-x86-64-gnu.tar.gz
          - os: ubuntu-22.04
            outfile: lde-linux-x86-64-musl
            zipfile: lde-linux-x86-64-musl.zip
            # built inside an Alpine container (real musl environment)
            musl: true
          - os: ubuntu-22.04-arm
            outfile: lde-linux-aarch64
            zipfile: lde-linux-aarch64.zip
            luajit_tarball: luajit-linux-aarch64-gnu.tar.gz
          - os: ubuntu-22.04-arm
            outfile: lde-linux-aarch64-musl
            zipfile: lde-linux-aarch64-musl.zip
            # native arm64 runner + Alpine container
            musl: true
          - os: windows-latest
            outfile: lde-windows-x86-64.exe
            zipfile: lde-windows-x86-64.zip
            luajit_tarball: luajit-windows-x86-64-gnu.tar.gz
            mingw_arch: x86_64
            mingw_dir: llvm-mingw-20260311-ucrt-x86_64
          - os: windows-11-arm
            outfile: lde-windows-aarch64.exe
            zipfile: lde-windows-aarch64.zip
            luajit_tarball: luajit-windows-aarch64-gnu.tar.gz
            mingw_arch: aarch64
            mingw_dir: llvm-mingw-20260311-ucrt-aarch64
          - os: macos-15-intel
            outfile: lde-macos-x86-64
            zipfile: lde-macos-x86-64.zip
            luajit_tarball: luajit-macos-x86-64.tar.gz
          - os: macos-15
            outfile: lde-macos-aarch64
            zipfile: lde-macos-aarch64.zip
            luajit_tarball: luajit-macos-aarch64.tar.gz
          - os: ubuntu-22.04-arm
            outfile: lde-android-aarch64
            zipfile: lde-android-aarch64.zip
            # Bionic build of LuaJIT; runs inside the termux container.
            luajit_tarball: luajit-linux-aarch64-android.tar.gz
            android: true
          - os: ubuntu-24.04
            outfile: lde-freebsd-x86-64
            zipfile: lde-freebsd-x86-64.zip
            luajit_tarball: luajit-freebsd-x86-64.tar.gz
            freebsd: true
            vm_arch: x86_64

    runs-on: ${{ matrix.os }}

    env:
      OUTFILE: ${{ matrix.outfile }}
      RUN_TESTS: ${{ inputs.run_tests }}
      BOOTSTRAP: ${{ inputs.bootstrap }}
      # The release binary carries its version; empty is safe everywhere else.
      LDE_RELEASE: ${{ inputs.publish == 'release' && '1' || '' }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache llvm-mingw (Windows)
        if: runner.os == 'Windows'
        id: cache-llvm-mingw
        uses: actions/cache@v5
        with:
          path: ${{ matrix.mingw_dir }}
          key: ${{ matrix.mingw_dir }}

      - name: Setup llvm-mingw (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ steps.cache-llvm-mingw.outputs.cache-hit }}" -ne "true") {
            curl -L -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20260311/llvm-mingw-20260311-ucrt-${{ matrix.mingw_arch }}.zip
            Expand-Archive -Path llvm-mingw.zip -DestinationPath .
          }
          echo "$env:GITHUB_WORKSPACE\${{ matrix.mingw_dir }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set SEA_CC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "SEA_CC=${{ matrix.mingw_arch }}-w64-mingw32-clang" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache LuaJIT
        if: inputs.bootstrap && !matrix.musl
        id: cache-luajit
        uses: actions/cache@v5
        with:
          path: luajit-dist
          key: ${{ matrix.luajit_tarball }}

      - name: Install LuaJIT
        if: inputs.bootstrap && !matrix.musl && steps.cache-luajit.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fL -o luajit.tar.gz \
            "https://github.com/lde-org/luajit/releases/download/latest/${{ matrix.luajit_tarball }}"
          mkdir luajit-dist
          tar -xzf luajit.tar.gz -C luajit-dist --strip-components=1
          rm luajit.tar.gz

      - name: Add LuaJIT to PATH
        if: inputs.bootstrap && !matrix.musl && !matrix.freebsd
        shell: bash
        run: echo "$GITHUB_WORKSPACE/luajit-dist" >> "$GITHUB_PATH"

      # Every row installs the nightly, musl included — `libc` picks the musl
      # build. For musl, `platform` is also set so the action skips its --setup
      # step: a musl binary cannot run on the glibc runner it is installed on.
      # The Alpine container below is where it runs.
      - uses: lde-org/setup-lde@master
        if: "!inputs.bootstrap"
        with:
          version: nightly
          libc: ${{ matrix.musl && 'musl' || '' }}
          platform: ${{ matrix.android && 'Android' || matrix.freebsd && 'FreeBSD' || matrix.musl && 'Linux' || '' }}
          arch: ${{ matrix.freebsd && matrix.vm_arch || '' }}
          dir: ${{ matrix.freebsd && github.workspace || '' }}

      - name: Cache native deps
        uses: actions/cache@v5
        with:
          path: |
            packages/*/target/curl-sys
            packages/*/target/deflate-sys
            packages/*/target/git2-sys
          key: native-deps-${{ matrix.os }}-${{ runner.arch }}${{ matrix.android && '-android' || '' }}${{ matrix.musl && '-musl' || '' }}${{ matrix.freebsd && format('-freebsd-{0}', matrix.vm_arch) || '' }}

      - name: Build lde
        if: "!matrix.android && !matrix.musl && !matrix.freebsd"
        shell: bash
        run: |
          if [ "$BOOTSTRAP" = "true" ]; then
            luajit minilde.lua -C packages/lde run -- compile --outfile "$OUTFILE"
          elif [ "$LDE_RELEASE" = "1" ]; then
            lde -C ./packages/lde compile --outfile "$OUTFILE"
          else
            lde -C ./packages/lde run -- compile --outfile "$OUTFILE"
          fi

      - name: Run tests
        if: inputs.run_tests && !matrix.android && !matrix.musl && !matrix.freebsd
        shell: bash
        run: ./packages/lde/${{ matrix.outfile }} test

      # musl build: inside an Alpine container, the one environment here that can
      # execute a musl binary (and therefore build a musl artifact). The musl
      # nightly installed by the setup-lde step is mounted in, so the build runs
      # on a real lde release instead of a minilde bootstrap.
      - name: Build and test lde (musl alpine)
        if: matrix.musl
        run: |
          docker run --rm -w /workspace \
            -v "${{ github.workspace }}":/workspace \
            -v "$HOME/.lde/lde":/usr/local/bin/lde:ro \
            -e OUTFILE -e RUN_TESTS -e BOOTSTRAP -e LDE_RELEASE \
            alpine:3.20 \
            sh -c '
              apk add --no-cache gcc clang musl-dev make cmake ninja curl tar git openssl-dev linux-headers libgcc &&
              if [ "$BOOTSTRAP" = "true" ]; then
                case "$(uname -m)" in x86_64) A=x86-64;; aarch64) A=aarch64;; esac &&
                curl -fsSLo /tmp/lj.tar.gz https://github.com/lde-org/luajit/releases/download/latest/luajit-linux-$A-musl.tar.gz &&
                mkdir -p /tmp/lj && tar -xzf /tmp/lj.tar.gz -C /tmp/lj --strip-components=1 &&
                PATH=/tmp/lj:$PATH luajit minilde.lua -C packages/lde run -- compile --outfile "$OUTFILE";
              elif [ "$LDE_RELEASE" = "1" ]; then
                lde -C packages/lde compile --outfile "$OUTFILE";
              else
                lde -C packages/lde run -- compile --outfile "$OUTFILE";
              fi &&
              chmod -R a+rw /workspace &&
              if [ "$RUN_TESTS" = "true" ]; then ./packages/lde/"$OUTFILE" test; fi
            '

      - name: Build and test lde (Android)
        if: matrix.android
        uses: ./.github/actions/android-env
        with:
          command: ${{ inputs.bootstrap && format('export PATH=/workspace/luajit-dist:$PATH && luajit /workspace/minilde.lua -C /workspace/packages/lde run -- compile --outfile /workspace/packages/lde/{0}', matrix.outfile) || format('/workspace/lde --setup && /workspace/lde -C /workspace/packages/lde run -- compile --outfile /workspace/packages/lde/{0}', matrix.outfile) }}${{ inputs.run_tests && format(' && cd /workspace && /workspace/packages/lde/{0} test', matrix.outfile) || '' }}
          provide_lde: ${{ !inputs.bootstrap }}
          release: ${{ inputs.publish == 'release' }}

      - name: Build and test lde (FreeBSD)
        if: matrix.freebsd
        uses: vmactions/freebsd-vm@v1
        timeout-minutes: 180
        with:
          release: "14.5"
          arch: ${{ matrix.vm_arch }}
          sync: rsync
          prepare: pkg install -y curl cmake ninja gcc git
          run: |
            set -e
            if [ "${{ inputs.bootstrap }}" = "true" ]; then
              export PATH="$PWD/luajit-dist:$PATH"
              luajit minilde.lua -C packages/lde run -- compile --outfile ${{ matrix.outfile }}
            elif [ "${{ inputs.publish }}" = "release" ]; then
              export LDE_RELEASE=1
              chmod +x lde
              ./lde -C packages/lde compile --outfile ${{ matrix.outfile }}
            else
              chmod +x lde
              ./lde -C packages/lde run -- compile --outfile ${{ matrix.outfile }}
            fi
            ${{ inputs.run_tests && format('./packages/lde/{0} test', matrix.outfile) || 'true' }}

      - name: Package binary
        if: inputs.publish != 'none' && runner.os != 'Windows'
        run: |
          cd packages/lde
          zip -q "${{ matrix.zipfile }}" "${{ matrix.outfile }}"

      - name: Package binary (Windows)
        if: inputs.publish != 'none' && runner.os == 'Windows'
        shell: pwsh
        run: |
          cd packages/lde
          Compress-Archive -Path "${{ matrix.outfile }}" -DestinationPath "${{ matrix.zipfile }}"

      - name: Upload artifact
        if: inputs.publish == 'artifact'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.zipfile }}
          path: packages/lde/${{ matrix.zipfile }}

      - name: Upload nightly release asset
        if: inputs.publish == 'nightly'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          body: |
            Automated nightly build from master.
            Commit: ${{ github.sha }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: packages/lde/${{ matrix.zipfile }}
          fail_on_unmatched_files: true

      - name: Upload release asset
        if: inputs.publish == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: packages/lde/${{ matrix.zipfile }}
