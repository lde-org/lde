name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      publish: release

  # After all release assets are built and uploaded, call the Docker workflow
  # (the images download this version's binaries).
  docker:
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ github.event.release.tag_name }}

  luarocks:
    needs: build
    if: "!github.event.release.prerelease"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install luarocks
        run: |
          sudo apt-get update && sudo apt-get install -y luarocks
          luarocks --local install dkjson

      - name: Generate rockspec
        id: rockspec
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::release tag '${{ github.event.release.tag_name }}' is not a semantic version"; exit 1 ;;
          esac
          sed \
            -e "s/@VERSION@/$version/g" \
            -e "s/@REVISION@/1/g" \
            -e "s|@SOURCE_URL@|https://github.com/lde-org/lde/archive/refs/tags/v$version.tar.gz|g" \
            -e "s|@SOURCE_DIR@|lde-$version|g" \
            -e "s|@INSTALL_ARGS@|--version $version|g" \
            luarocks/rockspec.template > "lde-$version-1.rockspec"
          echo "file=lde-$version-1.rockspec" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate rockspec
        run: luarocks lint "${{ steps.rockspec.outputs.file }}"

      - name: Publish to luarocks.org
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: |
          if [ -z "$LUAROCKS_API_KEY" ]; then
            echo "::error::LUAROCKS_API_KEY is not set (luarocks.org → Settings → API keys)"
            exit 1
          fi
          luarocks upload --api-key="$LUAROCKS_API_KEY" "${{ steps.rockspec.outputs.file }}"
