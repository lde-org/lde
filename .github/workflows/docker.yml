name: Docker

# The Release workflow dispatches this after it has built and uploaded the
# release assets (the images download the pinned version's binaries).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "lde release tag to package (e.g. v0.10.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: debian
            file: glibc.Dockerfile
            base: debian:bookworm
          - flavor: slim
            file: glibc.Dockerfile
            base: debian:bookworm-slim
          - flavor: alpine
            file: alpine.Dockerfile
            base: alpine:3.20

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Idiomatic <version>-<flavor> tags (nightly-alpine, v0.10.0-debian);
      # the bare {flavor} tag tracks the latest stable release.
      - name: Compute tags
        id: tags
        run: |
          if [ "${{ inputs.version }}" = "nightly" ]; then
            echo "TAGS=ghcr.io/lde-org/lde:nightly-${{ matrix.flavor }}" >> "$GITHUB_OUTPUT"
          else
            {
              echo "TAGS=ghcr.io/lde-org/lde:${{ matrix.flavor }}"
              echo "ghcr.io/lde-org/lde:${{ inputs.version }}-${{ matrix.flavor }}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            LDE_VERSION=${{ inputs.version }}
            BASE=${{ matrix.base }}
          tags: ${{ steps.tags.outputs.TAGS }}
          push: true
