name: Nightly

on:
  push:
    branches:
      - master
    paths:
      - "packages/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      run_tests: true
      publish: nightly

  # After the nightly binaries are built and uploaded, call the Docker workflow
  # so the images track the latest nightly build too.
  docker:
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: nightly

  luarocks:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install luarocks
        run: |
          sudo apt-get update && sudo apt-get install -y luarocks jq
          luarocks --local install dkjson

      - name: Generate nightly rockspec
        id: rockspec
        run: |
          latest="$(curl -fsSL https://api.github.com/repos/lde-org/lde/releases/latest | jq -r .tag_name)"
          latest="${latest#v}"
          IFS=. read -r major minor patch <<< "$latest"
          next="$major.$minor.$((patch + 1))"
          sed \
            -e "s/@VERSION@/$next/g" \
            -e "s/@REVISION@/0/g" \
            -e "s|@SOURCE_URL@|https://github.com/lde-org/lde/archive/refs/heads/master.tar.gz|g" \
            -e "s|@SOURCE_DIR@|lde-master|g" \
            -e "s|@INSTALL_ARGS@|--nightly|g" \
            luarocks/rockspec.template > "lde-$next-0.rockspec"
          echo "file=lde-$next-0.rockspec" >> "$GITHUB_OUTPUT"
          echo "Publishing lde $next-0 (newest release: $latest)"

      - name: Validate rockspec
        run: luarocks lint "${{ steps.rockspec.outputs.file }}"

      - name: Publish to luarocks.org
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: |
          if [ -z "$LUAROCKS_API_KEY" ]; then
            echo "::error::LUAROCKS_API_KEY is not set (luarocks.org → Settings → API keys)"
            exit 1
          fi
          # Same version every night: --force replaces the previous nightly.
          luarocks upload --force --api-key="$LUAROCKS_API_KEY" "${{ steps.rockspec.outputs.file }}"
